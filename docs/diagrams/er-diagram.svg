<svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="700" fill="#ffffff"/>
  <text x="30" y="34" font-size="16" font-weight="700" fill="#1a1a1a">Entity-relationship diagram</text>
  <text x="30" y="54" font-size="12" fill="#777">flight_seat and booking_seat are the associative entities that make this schema 3NF (see README §4)</text>

  <defs>
    <marker id="er-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- connectors -->
  <g stroke="#aaa" stroke-width="1.3" fill="none">
    <path d="M130,155 L130,420" marker-end="url(#er-arrow)"/>
    <path d="M420,155 L420,380 L140,380 L140,420" marker-end="url(#er-arrow)"/>
    <path d="M500,155 L500,220 L630,220 L630,248" marker-end="url(#er-arrow)"/>
    <path d="M805,155 L805,220 L700,220 L700,248" marker-end="url(#er-arrow)"/>
    <path d="M240,460 L318,460" marker-end="url(#er-arrow)"/>
    <path d="M630,347 L630,400 L430,400 L430,418" marker-end="url(#er-arrow)"/>
    <path d="M140,500 L140,578" marker-end="url(#er-arrow)"/>
  </g>

  <g font-size="10.5" fill="#888">
    <text x="136" y="180">1</text><text x="136" y="410">N</text>
    <text x="426" y="200">1</text><text x="150" y="410">N</text>
    <text x="506" y="180">1</text><text x="636" y="240">N</text>
    <text x="795" y="180">1</text><text x="706" y="240">N</text>
    <text x="250" y="453">1</text><text x="300" y="453">N</text>
    <text x="636" y="392">1</text><text x="440" y="410">N</text>
    <text x="148" y="520">1</text><text x="148" y="572">0/1</text>
  </g>

  <!-- passenger -->
  <g>
    <rect x="40" y="80" width="180" height="75" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
    <rect x="40" y="80" width="180" height="24" rx="6" fill="#1a1a1a"/>
    <text x="130" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">passenger</text>
    <text x="52" y="120" font-size="10" fill="#444" font-family="monospace">PK passenger_id</text>
    <text x="52" y="134" font-size="10" fill="#444" font-family="monospace">UK email</text>
    <text x="52" y="148" font-size="10" fill="#444" font-family="monospace">full_name, phone</text>
  </g>

  <!-- flight -->
  <g>
    <rect x="380" y="80" width="180" height="75" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
    <rect x="380" y="80" width="180" height="24" rx="6" fill="#1a1a1a"/>
    <text x="470" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">flight</text>
    <text x="392" y="120" font-size="10" fill="#444" font-family="monospace">PK flight_id</text>
    <text x="392" y="134" font-size="10" fill="#444" font-family="monospace">source, destination</text>
    <text x="392" y="148" font-size="10" fill="#444" font-family="monospace">departure/arrival_time</text>
  </g>

  <!-- seat -->
  <g>
    <rect x="720" y="80" width="170" height="75" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
    <rect x="720" y="80" width="170" height="24" rx="6" fill="#1a1a1a"/>
    <text x="805" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">seat</text>
    <text x="732" y="120" font-size="10" fill="#444" font-family="monospace">PK seat_id</text>
    <text x="732" y="134" font-size="10" fill="#444" font-family="monospace">UK seat_number</text>
    <text x="732" y="148" font-size="10" fill="#444" font-family="monospace">seat_class</text>
  </g>

  <!-- flight_seat -->
  <g>
    <rect x="520" y="250" width="220" height="97" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
    <rect x="520" y="250" width="220" height="24" rx="6" fill="#1a1a1a"/>
    <text x="630" y="267" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">flight_seat</text>
    <text x="532" y="290" font-size="10" fill="#444" font-family="monospace">PK flight_seat_id</text>
    <text x="532" y="304" font-size="10" fill="#444" font-family="monospace">FK flight_id, seat_id</text>
    <text x="532" y="318" font-size="10" fill="#444" font-family="monospace">status, price</text>
    <text x="532" y="332" font-size="10" fill="#c0392b" font-family="monospace">locked_at ← FOR UPDATE row</text>
  </g>

  <!-- booking -->
  <g>
    <rect x="40" y="420" width="200" height="80" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
    <rect x="40" y="420" width="200" height="24" rx="6" fill="#1a1a1a"/>
    <text x="140" y="437" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">booking</text>
    <text x="52" y="460" font-size="10" fill="#444" font-family="monospace">PK booking_id</text>
    <text x="52" y="474" font-size="10" fill="#444" font-family="monospace">FK passenger_id,</text>
    <text x="52" y="486" font-size="10" fill="#444" font-family="monospace">   flight_id</text>
    <text x="52" y="498" font-size="10" fill="#444" font-family="monospace">booking_status, total</text>
  </g>

  <!-- booking_seat -->
  <g>
    <rect x="320" y="418" width="240" height="80" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
    <rect x="320" y="418" width="240" height="24" rx="6" fill="#1a1a1a"/>
    <text x="440" y="435" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">booking_seat</text>
    <text x="332" y="458" font-size="10" fill="#444" font-family="monospace">PK booking_seat_id</text>
    <text x="332" y="472" font-size="10" fill="#444" font-family="monospace">FK booking_id,</text>
    <text x="332" y="484" font-size="10" fill="#444" font-family="monospace">   flight_seat_id</text>
    <text x="332" y="496" font-size="10" fill="#444" font-family="monospace">price_at_booking</text>
  </g>

  <!-- payment -->
  <g>
    <rect x="40" y="580" width="200" height="85" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
    <rect x="40" y="580" width="200" height="24" rx="6" fill="#1a1a1a"/>
    <text x="140" y="597" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">payment</text>
    <text x="52" y="620" font-size="10" fill="#444" font-family="monospace">PK payment_id</text>
    <text x="52" y="634" font-size="10" fill="#444" font-family="monospace">FK booking_id  UNIQUE</text>
    <text x="52" y="648" font-size="10" fill="#444" font-family="monospace">status, transaction_ref</text>
  </g>

  <rect x="320" y="540" width="600" height="150" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="340" y="564" font-size="12" font-weight="700" fill="#333">Why flight_seat exists as its own table</text>
  <text x="340" y="586" font-size="11" fill="#555">seat is a reusable seat map (number + class). flight_seat is that seat's</text>
  <text x="340" y="604" font-size="11" fill="#555">inventory row on one specific flight — status and price are per-flight,</text>
  <text x="340" y="622" font-size="11" fill="#555">not per-seat: 3A is AVAILABLE on tomorrow's flight even while it's</text>
  <text x="340" y="640" font-size="11" fill="#555">BOOKED on today's. Every concurrent lock request runs</text>
  <text x="340" y="658" font-size="11" fill="#c0392b" font-family="monospace">SELECT ... FROM flight_seat ... FOR UPDATE</text>
  <text x="340" y="676" font-size="11" fill="#555">against exactly this row — see the sequence diagram below.</text>
</svg>
