<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="300" fill="#ffffff"/>

  <text x="30" y="34" font-size="16" font-weight="700" fill="#1a1a1a">Request flow</text>
  <text x="30" y="54" font-size="12" fill="#777">One HTTP request, five layers, one PostgreSQL transaction where it matters</text>

  <!-- boxes -->
  <g font-size="12.5">
    <!-- 1 Client -->
    <rect x="30" y="90" width="140" height="70" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
    <text x="100" y="118" text-anchor="middle" font-weight="700" fill="#1a1a1a">Client</text>
    <text x="100" y="136" text-anchor="middle" fill="#666" font-size="11">React frontend</text>
    <text x="100" y="150" text-anchor="middle" fill="#666" font-size="11">curl / Postman</text>

    <!-- 2 Routes -->
    <rect x="205" y="90" width="140" height="70" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
    <text x="275" y="118" text-anchor="middle" font-weight="700" fill="#1a1a1a">Routes</text>
    <text x="275" y="136" text-anchor="middle" fill="#666" font-size="11">src/routes/</text>
    <text x="275" y="150" text-anchor="middle" fill="#666" font-size="11">verb + path only</text>

    <!-- 3 Controllers -->
    <rect x="380" y="90" width="140" height="70" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
    <text x="450" y="118" text-anchor="middle" font-weight="700" fill="#1a1a1a">Controllers</text>
    <text x="450" y="136" text-anchor="middle" fill="#666" font-size="11">src/controllers/</text>
    <text x="450" y="150" text-anchor="middle" fill="#666" font-size="11">parse + shape JSON</text>

    <!-- 4 Services -->
    <rect x="555" y="82" width="150" height="86" rx="6" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="630" y="110" text-anchor="middle" font-weight="700" fill="#ffffff">Services</text>
    <text x="630" y="128" text-anchor="middle" fill="#ddd" font-size="11">booking.service.js</text>
    <text x="630" y="142" text-anchor="middle" fill="#ddd" font-size="11">BEGIN / FOR UPDATE</text>
    <text x="630" y="156" text-anchor="middle" fill="#ddd" font-size="11">/ COMMIT lives here</text>

    <!-- 5 Postgres -->
    <rect x="735" y="90" width="140" height="70" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
    <text x="805" y="118" text-anchor="middle" font-weight="700" fill="#1a1a1a">PostgreSQL</text>
    <text x="805" y="136" text-anchor="middle" fill="#666" font-size="11">pg Pool</text>
    <text x="805" y="150" text-anchor="middle" fill="#666" font-size="11">row-level locks</text>
  </g>

  <!-- arrows -->
  <g stroke="#555" stroke-width="1.4" marker-end="url(#arrow)">
    <line x1="170" y1="125" x2="203" y2="125"/>
    <line x1="345" y1="125" x2="378" y2="125"/>
    <line x1="520" y1="125" x2="553" y2="125"/>
    <line x1="705" y1="125" x2="733" y2="125"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- annotation under services -->
  <line x1="630" y1="168" x2="630" y2="200" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="470" y="200" width="320" height="70" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="630" y="222" text-anchor="middle" font-size="11.5" fill="#333" font-weight="600">Only this layer touches SQL</text>
  <text x="630" y="240" text-anchor="middle" font-size="11" fill="#666">routes and controllers never see a query —</text>
  <text x="630" y="255" text-anchor="middle" font-size="11" fill="#666">every transaction boundary is explicit here</text>

  <text x="30" y="290" font-size="11" fill="#999">No ORM, no repository layer — the SQL that makes this project's point isn't hidden behind an abstraction.</text>
</svg>
