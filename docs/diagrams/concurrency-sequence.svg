<svg viewBox="0 0 940 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="940" height="620" fill="#ffffff"/>
  <text x="30" y="34" font-size="16" font-weight="700" fill="#1a1a1a">Two passengers, one seat: what actually happens</text>
  <text x="30" y="54" font-size="12" fill="#777">Real trace shape from tests/concurrency-test.js — seat 6C, requests arrive ~3ms apart</text>

  <!-- lifelines -->
  <g stroke="#ccc" stroke-width="1.3">
    <line x1="150" y1="100" x2="150" y2="580"/>
    <line x1="470" y1="100" x2="470" y2="580"/>
    <line x1="790" y1="100" x2="790" y2="580"/>
  </g>
  <g font-size="12.5" font-weight="700" fill="#1a1a1a">
    <rect x="60" y="66" width="180" height="32" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
    <text x="150" y="87" text-anchor="middle">Request A — passenger 6</text>
    <rect x="380" y="66" width="180" height="32" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
    <text x="470" y="87" text-anchor="middle">Request B — passenger 7</text>
    <rect x="690" y="66" width="200" height="32" rx="6" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="790" y="87" text-anchor="middle" fill="#fff">flight_seat row (seat 6C)</text>
  </g>

  <defs>
    <marker id="sq-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- t0: A begins + locks -->
  <text x="30" y="128" font-size="10.5" fill="#999" font-family="monospace">t=0ms</text>
  <line x1="150" y1="132" x2="480" y2="132" stroke="#333" stroke-width="1.3" marker-end="url(#sq-arrow)" transform="translate(0,0)"/>
  <line x1="150" y1="132" x2="782" y2="132" stroke="#333" stroke-width="1.3" marker-end="url(#sq-arrow)"/>
  <text x="160" y="126" font-size="10.5" fill="#333" font-family="monospace">BEGIN; SELECT ... FOR UPDATE</text>
  <rect x="770" y="140" width="40" height="14" fill="#e8f3ec" stroke="#4FAE7A"/>
  <text x="790" y="150" text-anchor="middle" font-size="9" fill="#1f7a44" font-weight="700">LOCK</text>

  <!-- t3ms: B begins, blocks -->
  <text x="30" y="182" font-size="10.5" fill="#999" font-family="monospace">t≈3ms</text>
  <line x1="470" y1="186" x2="782" y2="186" stroke="#333" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#sq-arrow)"/>
  <text x="480" y="180" font-size="10.5" fill="#333" font-family="monospace">BEGIN; SELECT ... FOR UPDATE</text>
  <rect x="700" y="196" width="180" height="20" rx="4" fill="#fff3cd" stroke="#e0c15c"/>
  <text x="790" y="210" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="700">BLOCKED — waiting on A's lock</text>

  <!-- A continues, still holding lock, status AVAILABLE check passes -->
  <text x="30" y="250" font-size="10.5" fill="#999" font-family="monospace">t≈28ms</text>
  <text x="160" y="248" font-size="10.5" fill="#333" font-family="monospace">status == 'AVAILABLE' → proceed</text>
  <line x1="150" y1="252" x2="480" y2="252" stroke="#333" stroke-width="1.3" marker-end="url(#sq-arrow)"/>
  <text x="160" y="270" font-size="10.5" fill="#333" font-family="monospace">UPDATE flight_seat SET status='LOCKED'</text>
  <line x1="150" y1="278" x2="782" y2="278" stroke="#333" stroke-width="1.3" marker-end="url(#sq-arrow)"/>

  <text x="160" y="300" font-size="10.5" fill="#333" font-family="monospace">INSERT booking (PENDING) + booking_seat</text>
  <text x="160" y="322" font-size="10.5" fill="#333" font-weight="700" font-family="monospace">COMMIT</text>
  <line x1="150" y1="326" x2="782" y2="326" stroke="#333" stroke-width="1.3" marker-end="url(#sq-arrow)"/>
  <rect x="760" y="334" width="60" height="16" fill="#e8f3ec" stroke="#4FAE7A"/>
  <text x="790" y="346" text-anchor="middle" font-size="9" fill="#1f7a44" font-weight="700">LOCK released</text>

  <rect x="60" y="358" width="180" height="26" rx="5" fill="#d9f2e3" stroke="#1f7a44"/>
  <text x="150" y="375" text-anchor="middle" font-size="11" fill="#1f7a44" font-weight="700">201 Created — booking_id=6</text>

  <!-- B unblocks -->
  <text x="30" y="418" font-size="10.5" fill="#999" font-family="monospace">t≈29ms</text>
  <text x="480" y="416" font-size="10.5" fill="#333" font-weight="700">B's SELECT ... FOR UPDATE unblocks</text>
  <text x="480" y="436" font-size="10.5" fill="#555">re-reads the row's current committed state —</text>
  <text x="480" y="452" font-size="10.5" fill="#555">not a stale snapshot from t=0</text>
  <line x1="782" y1="420" x2="480" y2="420" stroke="#333" stroke-width="1.3" marker-end="url(#sq-arrow)"/>

  <text x="480" y="478" font-size="10.5" fill="#333" font-family="monospace">status == 'LOCKED' → reject</text>
  <text x="480" y="498" font-size="10.5" fill="#333" font-weight="700" font-family="monospace">ROLLBACK</text>

  <rect x="380" y="512" width="180" height="26" rx="5" fill="#f3d4d1" stroke="#8a2f24"/>
  <text x="470" y="529" text-anchor="middle" font-size="11" fill="#8a2f24" font-weight="700">409 Seat already taken</text>

  <rect x="30" y="558" width="880" height="46" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="470" y="578" text-anchor="middle" font-size="11" fill="#333" font-weight="600">Nothing here is application-level locking — PostgreSQL itself serializes access to this one row.</text>
  <text x="470" y="594" text-anchor="middle" font-size="10.5" fill="#666">B isn't rejected because it "lost a race" in JS; it's rejected because it read the row's true state after waiting for it.</text>
</svg>
